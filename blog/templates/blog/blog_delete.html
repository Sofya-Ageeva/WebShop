{% extends 'catalog/base.html' %}
{% load static %}

{% block title %}Удалить статью - Блог{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>🗑️ Удалить статью</h1>
    <p>Вы уверены, что хотите удалить статью <strong>"{{ object.title }}"</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
        <a href="{% url 'blog:list' %}" class="btn btn-secondary"> Отмена</a>
    </form>
</div>
{% endblock %}
